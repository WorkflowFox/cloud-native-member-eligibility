openapi: 3.0.3
info:
  title: Cloud-Native Member Eligibility API
  description: >
    Read-only eligibility inquiry API consumed by the Angular frontend
    (see frontend/src/app/core/services/eligibility.service.ts).
    The frontend currently talks to this contract through
    MockEligibilityService; Stage 5 introduces an HttpClient-based
    implementation of the same EligibilityService abstraction against
    this API, without any component changes.

    Authentication and authorization are explicitly out of scope for
    this MVP (see spec.md §4, §13). No endpoint described here requires
    a credential, token, or API key.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Spring Boot development server

paths:
  /api/v1/eligibility:
    get:
      operationId: checkEligibility
      summary: Check a member's coverage eligibility on a given date
      description: >
        Evaluates whether the specified member has active coverage on
        checkDate and returns one of four business outcomes: ELIGIBLE,
        NOT_YET_ELIGIBLE, INELIGIBLE, or MEMBER_NOT_FOUND. All four
        outcomes are returned with HTTP 200; MEMBER_NOT_FOUND is a
        normal domain result, not a 404.
      security: []
      parameters:
        - name: memberId
          in: query
          required: true
          description: Exact synthetic member identifier to check. Blank is invalid.
          schema:
            type: string
            minLength: 1
          example: M-1001
        - name: checkDate
          in: query
          required: true
          description: ISO 8601 calendar date (YYYY-MM-DD) on which to evaluate coverage.
          schema:
            type: string
            format: date
          example: "2026-08-24"
      responses:
        "200":
          description: >
            A business result was determined. This includes the
            MEMBER_NOT_FOUND outcome, which is not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResult"
              examples:
                eligible:
                  summary: Active coverage
                  value:
                    memberId: M-1001
                    memberName: Jordan Testcase
                    planName: Acme Health Plan
                    coverageEffectiveDate: "2025-01-01"
                    coverageTerminationDate: null
                    checkCoverageOnDate: "2026-08-22"
                    eligibilityStatus: ELIGIBLE
                    eligibilityReason: Coverage is active on 2026-08-22.
                notYetEligible:
                  summary: Coverage has not started yet
                  value:
                    memberId: M-1002
                    memberName: Riley Sampleton
                    planName: Northwind Choice PPO
                    coverageEffectiveDate: "2027-02-01"
                    coverageTerminationDate: null
                    checkCoverageOnDate: "2026-08-22"
                    eligibilityStatus: NOT_YET_ELIGIBLE
                    eligibilityReason: >-
                      Coverage does not begin until February 1, 2027, which is
                      after August 22, 2026.
                ineligible:
                  summary: Coverage has ended
                  value:
                    memberId: M-1003
                    memberName: Avery Placeholder
                    planName: Beacon Standard HMO
                    coverageEffectiveDate: "2023-03-01"
                    coverageTerminationDate: "2025-12-31"
                    checkCoverageOnDate: "2026-08-22"
                    eligibilityStatus: INELIGIBLE
                    eligibilityReason: >-
                      Coverage ended on December 31, 2025, which is before
                      August 22, 2026.
                memberNotFound:
                  summary: No member matches the supplied ID
                  value:
                    memberId: M-9999
                    memberName: null
                    planName: null
                    coverageEffectiveDate: null
                    coverageTerminationDate: null
                    checkCoverageOnDate: "2026-08-22"
                    eligibilityStatus: MEMBER_NOT_FOUND
                    eligibilityReason: >-
                      No member matches ID M-9999. Confirm the member ID and
                      check again.
        "422":
          description: >
            memberId is missing/blank, or checkDate is missing or
            malformed. Returned instead of a business result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                detail: Validation failed. Provide a member ID and a valid check date.
                errors:
                  - field: memberId
                    message: memberId must not be blank.
        "500":
          description: >
            Unexpected technical failure. The response never exposes
            stack traces, SQL, file paths, or other infrastructure
            details; diagnostics are logged server-side only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: An unexpected error occurred. Please try again.

components:
  schemas:
    EligibilityStatus:
      type: string
      description: The evaluated business outcome of the inquiry.
      enum:
        - ELIGIBLE
        - NOT_YET_ELIGIBLE
        - INELIGIBLE
        - MEMBER_NOT_FOUND

    EligibilityResult:
      type: object
      description: >
        Eligibility decision for a single member/checkDate pair. For
        MEMBER_NOT_FOUND, memberName, planName,
        coverageEffectiveDate, and coverageTerminationDate are null.
      required:
        - memberId
        - memberName
        - planName
        - coverageEffectiveDate
        - coverageTerminationDate
        - checkCoverageOnDate
        - eligibilityStatus
        - eligibilityReason
      properties:
        memberId:
          type: string
          description: The member ID submitted in the request, echoed back.
          example: M-1001
        memberName:
          type: string
          nullable: true
          description: Synthetic member display name; null when the member is not found.
          example: Jordan Testcase
        planName:
          type: string
          nullable: true
          description: Synthetic plan display name; null when the member is not found.
          example: Acme Health Plan
        coverageEffectiveDate:
          type: string
          format: date
          nullable: true
          description: Date coverage begins; null when the member is not found.
          example: "2025-01-01"
        coverageTerminationDate:
          type: string
          format: date
          nullable: true
          description: >
            Date coverage ends, inclusive. Null means coverage has no
            recorded end date, or the member is not found.
          example: null
        checkCoverageOnDate:
          type: string
          format: date
          description: The checkDate submitted in the request, echoed back.
          example: "2026-08-22"
        eligibilityStatus:
          $ref: "#/components/schemas/EligibilityStatus"
        eligibilityReason:
          type: string
          description: Plain-language explanation of the eligibility status.
          example: Coverage is active on 2026-08-22.

    ValidationErrorResponse:
      type: object
      description: >
        Structured 422 response for invalid input. Never rendered
        directly to end users by the Angular client; the UI maps this
        to a friendly, field-level or form-level message.
      required:
        - detail
      properties:
        detail:
          type: string
          description: Safe, non-technical summary of the validation failure.
          example: Validation failed. Provide a member ID and a valid check date.
        errors:
          type: array
          description: Optional per-field validation failures.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                example: memberId
              message:
                type: string
                example: memberId must not be blank.

    ErrorResponse:
      type: object
      description: Safe, structured response for unexpected technical failures.
      required:
        - detail
      properties:
        detail:
          type: string
          example: An unexpected error occurred. Please try again.
